name: Full pin candidate evidence

on:
  pull_request:
    paths:
      - 'docs/experiments/issue-119-pin-xy/**'
      - 'docs/experiments/issue-126-full-pin/**'
      - 'project/experiments/full_pin_xy/**'
      - '.github/workflows/full-pin-evidence.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # same pinned checkout as project-structure.yml
        with:
          persist-credentials: false
      - name: Check published full pin contracts and evidence hashes
        run: python3 project/experiments/full_pin_xy/validate_repository.py
      - name: Compile reusable analysis and physical drivers
        run: python3 -m compileall -q project/experiments/full_pin_xy
      - name: Check real zero-wire contact and disconnected cases
        run: python3 project/experiments/full_pin_xy/test_zero_wire_access.py
