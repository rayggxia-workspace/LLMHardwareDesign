<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-label="openTPU small 典型数据流和控制关系"><style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif;fill:#203042} .sub{fill:#586b80}</style><rect width="1440" height="850" fill="white"/><text x="40" y="42.0" font-size="28" text-anchor="start" style="fill:#203042;font-weight:700">openTPU small：计算、共享存储与量化输入怎样连接</text><rect x="40" y="80" width="650" height="105" rx="12" fill="#f2eef8" stroke="#cfc4e4" stroke-width="2" stroke-dasharray="8 5"/><text x="65" y="115.0" font-size="22" text-anchor="start" style="fill:#6d5298;font-weight:700">SEQUENCER：调度和依赖控制</text><text x="65" y="150.0" font-size="19" text-anchor="start" style="fill:#203042;font-weight:400">向 MXU / VPU / QUANT 发命令；图中主体箭头只画数据流</text><rect x="1000" y="80" width="380" height="110" rx="12" fill="#eef3fa" stroke="#c0d2e8" stroke-width="2"/><text x="1190" y="115.0" font-size="21" text-anchor="middle" style="fill:#203042;font-weight:700">共享存储读取通道</text><text x="1190" y="150.0" font-size="18" text-anchor="middle" style="fill:#203042;font-weight:400">A：尺度 256 bit · B：权重块 256 bit</text><path d="M 1240 190 L 1240 300" fill="none" stroke="#457cb5" stroke-width="3"/><polygon points="1240,300 1245,287 1235,287" fill="#457cb5"/><text x="1260" y="250.0" font-size="18" text-anchor="start" style="fill:#457cb5;font-weight:400">数据输入</text><rect x="40" y="300" width="285" height="180" rx="12" fill="#fff2e8" stroke="#dd8b5d" stroke-width="2"/><text x="182.5" y="342.0" font-size="27" text-anchor="middle" style="fill:#203042;font-weight:700">TMEM</text><text x="182.5" y="390.0" font-size="18" text-anchor="middle" style="fill:#203042;font-weight:400">FP32 共享工作存储</text><text x="182.5" y="418.8" font-size="18" text-anchor="middle" style="fill:#203042;font-weight:400">多个计算与搬运单元访问</text><rect x="450" y="300" width="220" height="180" rx="12" fill="#f2f8e8" stroke="#9bb85c" stroke-width="2"/><text x="560.0" y="342.0" font-size="27" text-anchor="middle" style="fill:#203042;font-weight:700">QUANT</text><text x="560.0" y="390.0" font-size="18" text-anchor="middle" style="fill:#203042;font-weight:400">量化与尺度生成</text><text x="560.0" y="418.8" font-size="18" text-anchor="middle" style="fill:#203042;font-weight:400">FP32 → INT8 + 记录</text><rect x="790" y="300" width="230" height="180" rx="12" fill="#f0eef9" stroke="#9a91c6" stroke-width="2"/><text x="905.0" y="342.0" font-size="27" text-anchor="middle" style="fill:#203042;font-weight:700">ACT_RAM</text><text x="905.0" y="390.0" font-size="18" text-anchor="middle" style="fill:#203042;font-weight:400">存 INT8 激活与 scale</text><text x="905.0" y="418.8" font-size="18" text-anchor="middle" style="fill:#203042;font-weight:400">为 MXU 提供输入</text><rect x="1130" y="300" width="250" height="180" rx="12" fill="#eaf6ef" stroke="#74ac8e" stroke-width="2"/><text x="1255.0" y="342.0" font-size="27" text-anchor="middle" style="fill:#203042;font-weight:700">MXU</text><text x="1255.0" y="390.0" font-size="18" text-anchor="middle" style="fill:#203042;font-weight:400">矩阵运算</text><text x="1255.0" y="418.8" font-size="18" text-anchor="middle" style="fill:#203042;font-weight:400">结果写回 TMEM</text><path d="M325 380 L450 380" fill="none" stroke="#c66d3b" stroke-width="3"/><polygon points="450,380 437,375 437,385" fill="#c66d3b"/><text x="388" y="345.0" font-size="17" text-anchor="middle" style="fill:#a75e34;font-weight:400">读取</text><text x="388" y="372.2" font-size="17" text-anchor="middle" style="fill:#a75e34;font-weight:400">FP32</text><path d="M670 380 L790 380" fill="none" stroke="#769e38" stroke-width="3"/><polygon points="790,380 777,375 777,385" fill="#769e38"/><text x="730" y="345.0" font-size="17" text-anchor="middle" style="fill:#648b2d;font-weight:400">量化数据</text><text x="730" y="372.2" font-size="17" text-anchor="middle" style="fill:#648b2d;font-weight:400">＋ scale</text><path d="M1020 380 L1130 380" fill="none" stroke="#7165a6" stroke-width="3"/><polygon points="1130,380 1117,375 1117,385" fill="#7165a6"/><text x="1075" y="337.0" font-size="17" text-anchor="middle" style="fill:#7165a6;font-weight:400">512 bit</text><text x="1075" y="364.2" font-size="17" text-anchor="middle" style="fill:#7165a6;font-weight:400">＋128 bit</text><path d="M1240 480 L1240 555 L305 555 L305 480" fill="none" stroke="#ca6a35" stroke-width="3"/><polygon points="305,480 300,493 310,493" fill="#ca6a35"/><text x="805" y="540.0" font-size="18" text-anchor="middle" style="fill:#a55d32;font-weight:400">MXU 结果写回：t_wdata 声明 128 bit；也可读取 TMEM 旧值参与累加</text><rect x="40" y="665" width="285" height="140" rx="12" fill="#faeeed" stroke="#cb827d" stroke-width="2"/><text x="182" y="704.0" font-size="27" text-anchor="middle" style="fill:#203042;font-weight:700">VPU</text><text x="182" y="745.0" font-size="18" text-anchor="middle" style="fill:#203042;font-weight:400">FP32 向量运算</text><text x="182" y="773.8" font-size="18" text-anchor="middle" style="fill:#203042;font-weight:400">从 TMEM 取数、写回 TMEM</text><path d="M120 480 L120 665" fill="none" stroke="#407caa" stroke-width="3"/><polygon points="120,665 125,652 115,652" fill="#407caa"/><text x="145" y="594.0" font-size="17" text-anchor="start" style="fill:#407caa;font-weight:400">A/B 操作数</text><text x="145" y="621.2" font-size="17" text-anchor="start" style="fill:#407caa;font-weight:400">各 128 bit</text><path d="M270 665 L270 480" fill="none" stroke="#c66d3b" stroke-width="3"/><polygon points="270,480 265,493 275,493" fill="#c66d3b"/><text x="290" y="624.0" font-size="17" text-anchor="start" style="fill:#a55e34;font-weight:400">结果数据</text><text x="290" y="651.2" font-size="17" text-anchor="start" style="fill:#a55e34;font-weight:400">128 bit</text><rect x="450" y="665" width="930" height="140" rx="12" fill="#f6f8fb" stroke="#dbe3ec" stroke-width="2" stroke-dasharray="8 5"/><text x="480" y="705.0" font-size="21" text-anchor="start" style="fill:#203042;font-weight:700">这是一条典型处理链，不是所有任务必须执行的固定顺序。</text><text x="480" y="745.0" font-size="19" text-anchor="start" style="fill:#203042;font-weight:400">VPU 也能处理预处理、归约等任务；TMEM 还服务其他访问方。</text><text x="480" y="775.4" font-size="19" text-anchor="start" style="fill:#203042;font-weight:400">ACT_RAM 的 ACT 指激活数据存储，并不在其中计算激活函数。</text></svg>