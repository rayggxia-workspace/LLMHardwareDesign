<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680" role="img" aria-label="ACT_RAM 与 TMEM 的逻辑容量和 SRAM 映射"><style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif;fill:#203042} .sub{fill:#586b80}</style><rect width="1440" height="680" fill="white"/><text x="40" y="42.0" font-size="28" text-anchor="start" style="fill:#203042;font-weight:700">ACT_RAM 与 TMEM：都包含 SRAM 宏，职责和组织不同</text><rect x="35" y="85" width="585" height="540" rx="12" fill="#f7f5fc" stroke="#c5bddf" stroke-width="2"/><rect x="655" y="85" width="750" height="540" rx="12" fill="#fff8f2" stroke="#e4b28f" stroke-width="2"/><text x="65" y="130.0" font-size="25" text-anchor="start" style="fill:#635496;font-weight:700">ACT_RAM：量化激活输入缓冲</text><text x="65" y="170.0" font-size="21" text-anchor="start" style="fill:#203042;font-weight:400">2 KiB INT8 数据 + 512 B 尺度记录</text><text x="65" y="203.6" font-size="21" text-anchor="start" style="fill:#203042;font-weight:400">2 行 × 32 块 × 每块 32 字节</text><text x="65" y="260.0" font-size="19" text-anchor="start" style="fill:#635496;font-weight:700">激活行 0</text><rect x="65" y="275" width="150" height="65" rx="6" fill="#e2dcf3" stroke="#a99bcf" stroke-width="2"/><text x="140.0" y="314.0" font-size="18" text-anchor="middle" style="fill:#203042;font-weight:400">数据 32×128</text><rect x="230" y="275" width="150" height="65" rx="6" fill="#e2dcf3" stroke="#a99bcf" stroke-width="2"/><text x="305.0" y="314.0" font-size="18" text-anchor="middle" style="fill:#203042;font-weight:400">数据 32×128</text><rect x="395" y="275" width="180" height="65" rx="6" fill="#e2dcf3" stroke="#a99bcf" stroke-width="2"/><text x="485.0" y="314.0" font-size="18" text-anchor="middle" style="fill:#203042;font-weight:400">scale 32×64</text><text x="65" y="380.0" font-size="19" text-anchor="start" style="fill:#635496;font-weight:700">激活行 1</text><rect x="65" y="395" width="150" height="65" rx="6" fill="#e2dcf3" stroke="#a99bcf" stroke-width="2"/><text x="140.0" y="434.0" font-size="18" text-anchor="middle" style="fill:#203042;font-weight:400">数据 32×128</text><rect x="230" y="395" width="150" height="65" rx="6" fill="#e2dcf3" stroke="#a99bcf" stroke-width="2"/><text x="305.0" y="434.0" font-size="18" text-anchor="middle" style="fill:#203042;font-weight:400">数据 32×128</text><rect x="395" y="395" width="180" height="65" rx="6" fill="#e2dcf3" stroke="#a99bcf" stroke-width="2"/><text x="485.0" y="434.0" font-size="18" text-anchor="middle" style="fill:#203042;font-weight:400">scale 32×64</text><text x="65" y="555.0" font-size="19" text-anchor="start" style="fill:#635496;font-weight:400">合计：4 块数据宏 + 2 块 scale 宏</text><text x="65" y="585.4" font-size="19" text-anchor="start" style="fill:#635496;font-weight:400">两个数据宏并成每行 256 bit，scale 每行 64 bit</text><text x="685" y="130.0" font-size="25" text-anchor="start" style="fill:#ab5d2d;font-weight:700">TMEM：FP32 共享工作存储</text><text x="685" y="170.0" font-size="21" text-anchor="start" style="fill:#203042;font-weight:400">逻辑容量 64 KiB = 16,384 × 32 bit</text><text x="685" y="203.6" font-size="21" text-anchor="start" style="fill:#203042;font-weight:400">3 份一致副本；每份 4 bank，共 12 块宏</text><text x="685" y="303.0" font-size="18" text-anchor="start" style="fill:#a35b31;font-weight:400">副本 1</text><rect x="790" y="265" width="130" height="60" rx="6" fill="#f8ddc7" stroke="#d49a73" stroke-width="2"/><text x="855" y="290.0" font-size="17" text-anchor="middle" style="fill:#203042;font-weight:400">Bank 0</text><text x="855" y="313.0" font-size="16" text-anchor="middle" style="fill:#203042;font-weight:400">4096×32</text><rect x="935" y="265" width="130" height="60" rx="6" fill="#f8ddc7" stroke="#d49a73" stroke-width="2"/><text x="1000" y="290.0" font-size="17" text-anchor="middle" style="fill:#203042;font-weight:400">Bank 1</text><text x="1000" y="313.0" font-size="16" text-anchor="middle" style="fill:#203042;font-weight:400">4096×32</text><rect x="1080" y="265" width="130" height="60" rx="6" fill="#f8ddc7" stroke="#d49a73" stroke-width="2"/><text x="1145" y="290.0" font-size="17" text-anchor="middle" style="fill:#203042;font-weight:400">Bank 2</text><text x="1145" y="313.0" font-size="16" text-anchor="middle" style="fill:#203042;font-weight:400">4096×32</text><rect x="1225" y="265" width="130" height="60" rx="6" fill="#f8ddc7" stroke="#d49a73" stroke-width="2"/><text x="1290" y="290.0" font-size="17" text-anchor="middle" style="fill:#203042;font-weight:400">Bank 3</text><text x="1290" y="313.0" font-size="16" text-anchor="middle" style="fill:#203042;font-weight:400">4096×32</text><text x="685" y="386.0" font-size="18" text-anchor="start" style="fill:#a35b31;font-weight:400">副本 2</text><rect x="790" y="348" width="130" height="60" rx="6" fill="#f8ddc7" stroke="#d49a73" stroke-width="2"/><text x="855" y="373.0" font-size="17" text-anchor="middle" style="fill:#203042;font-weight:400">Bank 0</text><text x="855" y="396.0" font-size="16" text-anchor="middle" style="fill:#203042;font-weight:400">4096×32</text><rect x="935" y="348" width="130" height="60" rx="6" fill="#f8ddc7" stroke="#d49a73" stroke-width="2"/><text x="1000" y="373.0" font-size="17" text-anchor="middle" style="fill:#203042;font-weight:400">Bank 1</text><text x="1000" y="396.0" font-size="16" text-anchor="middle" style="fill:#203042;font-weight:400">4096×32</text><rect x="1080" y="348" width="130" height="60" rx="6" fill="#f8ddc7" stroke="#d49a73" stroke-width="2"/><text x="1145" y="373.0" font-size="17" text-anchor="middle" style="fill:#203042;font-weight:400">Bank 2</text><text x="1145" y="396.0" font-size="16" text-anchor="middle" style="fill:#203042;font-weight:400">4096×32</text><rect x="1225" y="348" width="130" height="60" rx="6" fill="#f8ddc7" stroke="#d49a73" stroke-width="2"/><text x="1290" y="373.0" font-size="17" text-anchor="middle" style="fill:#203042;font-weight:400">Bank 3</text><text x="1290" y="396.0" font-size="16" text-anchor="middle" style="fill:#203042;font-weight:400">4096×32</text><text x="685" y="469.0" font-size="18" text-anchor="start" style="fill:#a35b31;font-weight:400">副本 3</text><rect x="790" y="431" width="130" height="60" rx="6" fill="#f8ddc7" stroke="#d49a73" stroke-width="2"/><text x="855" y="456.0" font-size="17" text-anchor="middle" style="fill:#203042;font-weight:400">Bank 0</text><text x="855" y="479.0" font-size="16" text-anchor="middle" style="fill:#203042;font-weight:400">4096×32</text><rect x="935" y="431" width="130" height="60" rx="6" fill="#f8ddc7" stroke="#d49a73" stroke-width="2"/><text x="1000" y="456.0" font-size="17" text-anchor="middle" style="fill:#203042;font-weight:400">Bank 1</text><text x="1000" y="479.0" font-size="16" text-anchor="middle" style="fill:#203042;font-weight:400">4096×32</text><rect x="1080" y="431" width="130" height="60" rx="6" fill="#f8ddc7" stroke="#d49a73" stroke-width="2"/><text x="1145" y="456.0" font-size="17" text-anchor="middle" style="fill:#203042;font-weight:400">Bank 2</text><text x="1145" y="479.0" font-size="16" text-anchor="middle" style="fill:#203042;font-weight:400">4096×32</text><rect x="1225" y="431" width="130" height="60" rx="6" fill="#f8ddc7" stroke="#d49a73" stroke-width="2"/><text x="1290" y="456.0" font-size="17" text-anchor="middle" style="fill:#203042;font-weight:400">Bank 3</text><text x="1290" y="479.0" font-size="16" text-anchor="middle" style="fill:#203042;font-weight:400">4096×32</text><text x="685" y="555.0" font-size="19" text-anchor="start" style="fill:#a35b31;font-weight:400">物理存储位合计 192 KiB，但逻辑可用容量仍为 64 KiB。</text><text x="685" y="585.4" font-size="19" text-anchor="start" style="fill:#a35b31;font-weight:400">副本帮助安排读访问；写入需更新全部副本。</text><text x="40" y="660.0" font-size="19" text-anchor="start" style="fill:#5a6b7f;font-weight:400">宏内的存储阵列固定在宏块内部；选择器、流水寄存器、保持／旁路逻辑是宏外的标准单元。图中排布是结构示意。</text></svg>