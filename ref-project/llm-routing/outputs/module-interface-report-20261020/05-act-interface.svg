<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="710" viewBox="0 0 1440 710" role="img" aria-label="ACT_RAM 的逻辑输入输出和位宽"><style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif;fill:#203042} .sub{fill:#586b80}</style><rect width="1440" height="710" fill="white"/><text x="35" y="43.0" font-size="28" text-anchor="start" style="fill:#203042;font-weight:700">openTPU small：ACT_RAM 的逻辑接口</text><text x="35" y="80.0" font-size="20" text-anchor="start" style="fill:#607087;font-weight:400">原始展开网表：输入 220 bit / 输出 640 bit；下图为逻辑分组，不代表所有声明位都有保留布线。</text><rect x="585" y="135" width="285" height="485" rx="12" fill="#efedf8" stroke="#b7afd1" stroke-width="2"/><text x="727" y="190.0" font-size="31" text-anchor="middle" style="fill:#203042;font-weight:700">ACT_RAM</text><text x="727" y="250" font-size="23" text-anchor="middle" style="fill:#203042;font-weight:400">2 行激活输入缓冲</text><text x="727" y="298" font-size="23" text-anchor="middle" style="fill:#203042;font-weight:400">INT8 数据 + scale</text><text x="727" y="346" font-size="23" text-anchor="middle" style="fill:#203042;font-weight:400">6 块 SRAM 宏</text><text x="727" y="394" font-size="23" text-anchor="middle" style="fill:#203042;font-weight:400">外加写入流水逻辑</text><text x="727" y="525.0" font-size="19" text-anchor="middle" style="fill:#675c86;font-weight:400">不计算 ReLU / GELU</text><text x="727" y="555.4" font-size="19" text-anchor="middle" style="fill:#675c86;font-weight:400">不存一般 FP32 中间结果</text><rect x="30" y="140" width="505" height="86" rx="7" fill="#f5f7fa" stroke="#e0e6ef" stroke-width="2"/><text x="48" y="165.0" font-size="19" text-anchor="start" style="fill:#67569c;font-weight:700">量化器 → 写数据</text><text x="48" y="191.0" font-size="18" text-anchor="start" style="fill:#203042;font-weight:700">w_data 32 + we 4 = 36 bit</text><text x="48" y="215.0" font-size="16" text-anchor="start" style="fill:#68798c;font-weight:400">每次最多写 4 个连续 INT8 字节</text><path d="M535 183 L585 183" fill="none" stroke="#8878b4" stroke-width="3"/><polygon points="585,183 572,178 572,188" fill="#8878b4"/><rect x="30" y="245" width="505" height="86" rx="7" fill="#f5f7fa" stroke="#e0e6ef" stroke-width="2"/><text x="48" y="270.0" font-size="19" text-anchor="start" style="fill:#67569c;font-weight:700">量化器 → 行号／索引／复制</text><text x="48" y="296.0" font-size="18" text-anchor="start" style="fill:#203042;font-weight:700">w_row 8 + w_idx 32 + w_dup 1 + w_off 8 = 49 bit</text><text x="48" y="320.0" font-size="16" text-anchor="start" style="fill:#68798c;font-weight:400">定位要写入的位置；支持复制写</text><path d="M535 288 L585 288" fill="none" stroke="#8878b4" stroke-width="3"/><polygon points="585,288 572,283 572,293" fill="#8878b4"/><rect x="30" y="350" width="505" height="86" rx="7" fill="#f5f7fa" stroke="#e0e6ef" stroke-width="2"/><text x="48" y="375.0" font-size="19" text-anchor="start" style="fill:#67569c;font-weight:700">量化器 → 尺度记录</text><text x="48" y="401.0" font-size="18" text-anchor="start" style="fill:#203042;font-weight:700">s_data 64 + swe 1 + s_row 8 + s_blk 16 = 89 bit</text><text x="48" y="425.0" font-size="16" text-anchor="start" style="fill:#68798c;font-weight:400">64 bit 记录 = FP32 Sa + 四个 8 bit 子块偏移</text><path d="M535 393 L585 393" fill="none" stroke="#8878b4" stroke-width="3"/><polygon points="585,393 572,388 572,398" fill="#8878b4"/><rect x="30" y="455" width="505" height="86" rx="7" fill="#f5f7fa" stroke="#e0e6ef" stroke-width="2"/><text x="48" y="480.0" font-size="19" text-anchor="start" style="fill:#67569c;font-weight:700">MXU 相关读控制 → ACT_RAM</text><text x="48" y="506.0" font-size="18" text-anchor="start" style="fill:#203042;font-weight:700">块号／分组／读使能 44 + r_use 1 = 45 bit</text><text x="48" y="530.0" font-size="16" text-anchor="start" style="fill:#68798c;font-weight:400">r_use 表示本次读数据被消费；主要用于仿真检查</text><path d="M535 498 L585 498" fill="none" stroke="#8878b4" stroke-width="3"/><polygon points="585,498 572,493 572,503" fill="#8878b4"/><rect x="30" y="560" width="505" height="86" rx="7" fill="#f5f7fa" stroke="#e0e6ef" stroke-width="2"/><text x="48" y="585.0" font-size="19" text-anchor="start" style="fill:#67569c;font-weight:700">基础控制 → ACT_RAM</text><text x="48" y="611.0" font-size="18" text-anchor="start" style="fill:#203042;font-weight:700">clk = 1 bit</text><text x="48" y="635.0" font-size="16" text-anchor="start" style="fill:#68798c;font-weight:400">与数据路径分开；220 = 36 + 49 + 89 + 45 + 1</text><path d="M535 603 L585 603" fill="none" stroke="#8878b4" stroke-width="3"/><polygon points="585,603 572,598 572,608" fill="#8878b4"/><rect x="925" y="210" width="480" height="132" rx="7" fill="#f0edf8" stroke="#d4cbe8" stroke-width="2"/><text x="945" y="246.0" font-size="21" text-anchor="start" style="fill:#67569c;font-weight:700">ACT_RAM → MXU 激活数据</text><text x="945" y="286.0" font-size="25" text-anchor="start" style="fill:#203042;font-weight:700">r_data = 512 bit</text><text x="945" y="319.0" font-size="19" text-anchor="start" style="fill:#68798c;font-weight:400">2 行 × 32 字节 × 8 bit</text><path d="M870 276 L925 276" fill="none" stroke="#8878b4" stroke-width="3"/><polygon points="925,276 912,271 912,281" fill="#8878b4"/><rect x="925" y="395" width="480" height="132" rx="7" fill="#f0edf8" stroke="#d4cbe8" stroke-width="2"/><text x="945" y="431.0" font-size="21" text-anchor="start" style="fill:#67569c;font-weight:700">ACT_RAM → MXU 尺度记录</text><text x="945" y="471.0" font-size="25" text-anchor="start" style="fill:#203042;font-weight:700">r_scale = 128 bit</text><text x="945" y="504.0" font-size="19" text-anchor="start" style="fill:#68798c;font-weight:400">2 行 × 64 bit</text><path d="M870 461 L925 461" fill="none" stroke="#8878b4" stroke-width="3"/><polygon points="925,461 912,456 912,466" fill="#8878b4"/><text x="35" y="690.0" font-size="19" text-anchor="start" style="fill:#596b80;font-weight:400">读出数据和尺度已从 SRAM 宏引脚追到 MXU；量化器写入方向的完整多级路径未在本次重新逐段统计。</text></svg>