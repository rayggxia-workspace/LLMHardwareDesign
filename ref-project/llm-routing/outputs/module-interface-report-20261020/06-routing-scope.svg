<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600" role="img" aria-label="逻辑接口、宏连接段、完整数据通路的统计范围"><style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif;fill:#203042} .sub{fill:#586b80}</style><rect width="1440" height="600" fill="white"/><text x="35" y="45.0" font-size="28" text-anchor="start" style="fill:#203042;font-weight:700">一条数据通路，三个需要区分的统计范围</text><rect x="40" y="180" width="240" height="140" rx="12" fill="#eaf3f8" stroke="#cbd7e4" stroke-width="2"/><text x="160.0" y="225.0" font-size="24" text-anchor="middle" style="fill:#203042;font-weight:700">MXU / VPU</text><text x="160.0" y="270.0" font-size="18" text-anchor="middle" style="fill:#203042;font-weight:400">计算结果输出逻辑</text><rect x="450" y="180" width="270" height="140" rx="12" fill="#fff2e8" stroke="#cbd7e4" stroke-width="2"/><text x="585.0" y="225.0" font-size="24" text-anchor="middle" style="fill:#203042;font-weight:700">TMEM 接口逻辑</text><text x="585.0" y="270.0" font-size="18" text-anchor="middle" style="fill:#203042;font-weight:400">选择器 / 数据寄存器</text><rect x="875" y="180" width="250" height="140" rx="12" fill="#fff2e8" stroke="#cbd7e4" stroke-width="2"/><text x="1000.0" y="225.0" font-size="24" text-anchor="middle" style="fill:#203042;font-weight:700">TMEM 后续逻辑</text><text x="1000.0" y="270.0" font-size="18" text-anchor="middle" style="fill:#203042;font-weight:400">选择、流水及分发</text><rect x="1230" y="180" width="175" height="140" rx="12" fill="#f6dfcc" stroke="#cbd7e4" stroke-width="2"/><text x="1317.5" y="225.0" font-size="24" text-anchor="middle" style="fill:#203042;font-weight:700">SRAM 宏</text><text x="1317.5" y="270.0" font-size="18" text-anchor="middle" style="fill:#203042;font-weight:400">固定的存储块</text><path d="M280 250 L450 250" fill="none" stroke="#2686a1" stroke-width="3"/><polygon points="450,250 437,245 437,255" fill="#2686a1"/><text x="365" y="218.0" font-size="20" text-anchor="middle" style="fill:#2686a1;font-weight:400">接口段</text><path d="M720 250 L875 250" fill="none" stroke="#a57c54" stroke-width="3"/><polygon points="875,250 862,245 862,255" fill="#a57c54"/><text x="797" y="218.0" font-size="19" text-anchor="middle" style="fill:#8d6b4c;font-weight:400">内部连接</text><path d="M1125 250 L1230 250" fill="none" stroke="#cc7c28" stroke-width="3"/><polygon points="1230,250 1217,245 1217,255" fill="#cc7c28"/><text x="1177" y="147.0" font-size="17" text-anchor="middle" style="fill:#a46726;font-weight:400">可含</text><text x="1177" y="174.2" font-size="17" text-anchor="middle" style="fill:#a46726;font-weight:400">BUF/INV</text><path d="M1125 350 L1230 350" fill="none" stroke="#cc7c28" stroke-width="3"/><text x="1177" y="385.0" font-size="21" text-anchor="middle" style="fill:#a46726;font-weight:400">SRAM 宏连接段</text><path d="M40 440 L1230 440" fill="none" stroke="#1e6f87" stroke-width="3"/><text x="635" y="480.0" font-size="23" text-anchor="middle" style="fill:#1e6f87;font-weight:700">完整数据通路：继续穿过 TMEM 选择器和数据寄存器，一直追到 SRAM 宏引脚</text><text x="35" y="550.0" font-size="19" text-anchor="start" style="fill:#5b6d80;font-weight:400">中间若经过逻辑门／寄存器，数据继续传递，但已是多条不同的物理 net；同一 net 本身也可经过多个金属层。</text><text x="35" y="580.4" font-size="19" text-anchor="start" style="fill:#5b6d80;font-weight:400">本文“完整”只针对指定读写数据两端，不包含宏内部金属，也不自动包含地址、请求、使能、时钟和电源。</text></svg>