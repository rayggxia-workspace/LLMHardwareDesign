<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-label="llaccel 核心模块关系、数据通路与存储边界"><rect width="1600" height="1080" fill="white"/><text x="35" y="45.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#24384d">llaccel：任务调度、计算引擎与共享存储怎样连接</text><text x="35" y="80.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#5d7086">逻辑结构示意；位宽为 RTL 声明。框的位置和大小不表示实际 placement。</text><rect x="30" y="105" width="1150" height="885" rx="12" fill="#f7f9fc" stroke="#c5d2e0" stroke-width="2"/><text x="55" y="137.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#24384d">当前物理分析范围：llaccel_core</text><rect x="75" y="165" width="205" height="100" rx="12" fill="#f0f2f6" stroke="#bdc8d5" stroke-width="2"/><text x="177" y="195.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#24384d">PERF COUNTERS</text><text x="177" y="224.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#24384d">27 × 64 bit 性能计数</text><text x="177" y="249.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#62758b">统计脉冲连线略</text><rect x="320" y="165" width="360" height="100" rx="12" fill="#eee8f7" stroke="#bda8d5" stroke-width="2"/><text x="500" y="204.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#24384d">COMMAND PROCESSOR</text><text x="500" y="238.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#24384d">取指、发任务、接收完成状态</text><rect x="850" y="165" width="280" height="100" rx="12" fill="#edf3f9" stroke="#a6bfd5" stroke-width="2"/><text x="990" y="204.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#24384d">DRAM ARBITER</text><text x="990" y="238.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#24384d">取指 / DMA / ATTENTION</text><path d="M680 215 L850 215" fill="none" stroke="#397c9c" stroke-width="3"/><polygon points="850,215 837,210 837,220" fill="#397c9c"/><polygon points="680,215 693,220 693,210" fill="#397c9c"/><text x="765" y="190.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#24384d">取指 / 返回</text><rect x="1240" y="165" width="325" height="160" rx="12" fill="#f2f5f8" stroke="#aebdcc" stroke-width="2" stroke-dasharray="8 6"/><text x="1402" y="204.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#24384d">外部 DRAM 接口</text><text x="1402" y="245.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#24384d">读 / 写数据各 512 bit</text><text x="1402" y="274.45" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#24384d">另有地址、掩码与握手</text><path d="M1130 215 L1240 215" fill="none" stroke="#397c9c" stroke-width="3"/><polygon points="1240,215 1227,210 1227,220" fill="#397c9c"/><polygon points="1130,215 1143,220 1143,210" fill="#397c9c"/><text x="1185" y="192.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#24384d">读 / 写</text><rect x="75" y="370" width="235" height="155" rx="12" fill="#e3f4f4" stroke="#9bbfc2" stroke-width="2"/><text x="192" y="411.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#24384d">DMA</text><text x="192" y="451.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#24384d">片内外数据搬运</text><rect x="345" y="370" width="235" height="155" rx="12" fill="#e5eefb" stroke="#9eb6d5" stroke-width="2"/><text x="462" y="411.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#24384d">GEMM</text><text x="462" y="451.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#24384d">INT8 矩阵乘、累加</text><text x="462" y="478.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#24384d">偏置、再量化与写回</text><rect x="615" y="370" width="235" height="155" rx="12" fill="#eee9f8" stroke="#b3a4cd" stroke-width="2"/><text x="732" y="411.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#24384d">VECTOR</text><text x="732" y="451.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#24384d">向量、归约、SiLU</text><text x="732" y="478.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#24384d">RMSNorm / RoPE 等</text><rect x="885" y="370" width="235" height="155" rx="12" fill="#faece5" stroke="#d1aa96" stroke-width="2"/><text x="1002" y="411.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#24384d">ATTENTION</text><text x="1002" y="451.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#24384d">Q·K、归一化</text><text x="1002" y="478.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#24384d">V 加权与结果写回</text><path d="M500 265 L500 320" fill="none" stroke="#8864a6" stroke-width="3" stroke-dasharray="7 5"/><path d="M192 320 L1002 320" fill="none" stroke="#8864a6" stroke-width="3" stroke-dasharray="7 5"/><path d="M192 320 L192 370" fill="none" stroke="#8864a6" stroke-width="3" stroke-dasharray="7 5"/><polygon points="192,370 197,357 187,357" fill="#8864a6"/><path d="M462 320 L462 370" fill="none" stroke="#8864a6" stroke-width="3" stroke-dasharray="7 5"/><polygon points="462,370 467,357 457,357" fill="#8864a6"/><path d="M732 320 L732 370" fill="none" stroke="#8864a6" stroke-width="3" stroke-dasharray="7 5"/><polygon points="732,370 737,357 727,357" fill="#8864a6"/><path d="M1002 320 L1002 370" fill="none" stroke="#8864a6" stroke-width="3" stroke-dasharray="7 5"/><polygon points="1002,370 1007,357 997,357" fill="#8864a6"/><text x="515" y="298.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#78558f">每个引擎：512 bit 指令 + 有效 / 就绪 / 完成等控制</text><path d="M75 420 L48 420 L48 280 L900 280 L900 265" fill="none" stroke="#44869d" stroke-width="3"/><polygon points="900,265 895,278 905,278" fill="#44869d"/><polygon points="75,420 62,415 62,425" fill="#44869d"/><text x="70" y="303.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#39788f">DMA 的 DRAM 请求 / 返回</text><path d="M1080 370 L1080 265" fill="none" stroke="#44869d" stroke-width="3"/><polygon points="1080,265 1075,278 1085,278" fill="#44869d"/><polygon points="1080,370 1085,357 1075,357" fill="#44869d"/><text x="1095" y="303.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#39788f">DRAM</text><text x="1095" y="327.8" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#39788f">数据</text><rect x="75" y="680" width="1045" height="130" rx="12" fill="#e6f3ed" stroke="#9ebcad" stroke-width="2"/><text x="597" y="723.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#24384d">SRAM CROSSBAR：选 bank、选数据、处理访问冲突</text><text x="597" y="764.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#24384d">10 个逻辑请求口共享同一组 bank；冲突时按固定优先级接受请求</text><path d="M192 525 L192 680" fill="none" stroke="#3c8c79" stroke-width="3"/><polygon points="192,680 197,667 187,667" fill="#3c8c79"/><polygon points="192,525 187,538 197,538" fill="#3c8c79"/><text x="207" y="575.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#357b6b">读 512 / 写 512</text><path d="M462 525 L462 680" fill="none" stroke="#3c8c79" stroke-width="3"/><polygon points="462,680 467,667 457,667" fill="#3c8c79"/><polygon points="462,525 457,538 467,538" fill="#3c8c79"/><text x="477" y="575.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#357b6b">权重读 2048</text><text x="477" y="601.35" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#357b6b">A / 参数读 512</text><text x="477" y="627.7" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#357b6b">结果写 512</text><path d="M732 525 L732 680" fill="none" stroke="#3c8c79" stroke-width="3"/><polygon points="732,680 737,667 727,667" fill="#3c8c79"/><polygon points="732,525 727,538 737,538" fill="#3c8c79"/><text x="747" y="575.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#357b6b">两个读口各 512</text><text x="747" y="601.35" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#357b6b">结果写 512</text><path d="M1002 525 L1002 680" fill="none" stroke="#3c8c79" stroke-width="3"/><polygon points="1002,680 1007,667 997,667" fill="#3c8c79"/><polygon points="1002,525 997,538 1007,538" fill="#3c8c79"/><text x="1017" y="575.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#357b6b">读 512 / 写 512</text><rect x="350" y="875" width="540" height="80" rx="12" fill="#fff3dd" stroke="#dab67f" stroke-width="2"/><text x="620" y="908.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#24384d">16 组 bank 引脚：每组读 / 写数据各 128 bit</text><text x="620" y="938.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#24384d">另有地址、字节写掩码和使能</text><path d="M620 810 L620 875" fill="none" stroke="#a67c3c" stroke-width="3"/><polygon points="620,875 625,862 615,862" fill="#a67c3c"/><polygon points="620,810 615,823 625,823" fill="#a67c3c"/><rect x="1240" y="755" width="325" height="200" rx="12" fill="#faf7f0" stroke="#bbaa8d" stroke-width="2" stroke-dasharray="8 6"/><text x="1402" y="798.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#24384d">16 个 SRAM bank</text><text x="1402" y="839.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#24384d">存储体在 core 之外</text><text x="1402" y="868.45" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#24384d">本次 ODB 不包含这些宏</text><text x="1402" y="897.9" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#24384d">不能用本图推断实际距离</text><path d="M890 915 L1240 915" fill="none" stroke="#a67c3c" stroke-width="3" stroke-dasharray="7 5"/><polygon points="1240,915 1227,910 1227,920" fill="#a67c3c"/><polygon points="890,915 903,920 903,910" fill="#a67c3c"/><text x="1050" y="891.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#96713b">核心分析止于 bank 引脚</text><text x="35" y="1030.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#5a6d82">实线为数据访问关系（双向箭头概括独立的读 / 写方向）；紫色虚线为任务控制。</text><text x="35" y="1060.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#5a6d82">本次详细布线统计覆盖 GEMM、VECTOR 的 SRAM 数据通路；ATTENTION、DMA、DRAM 在这里用于交代系统关系。</text></svg>