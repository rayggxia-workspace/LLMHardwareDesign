<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1060" viewBox="0 0 1680 1060" role="img" aria-label="GEMM 黑箱接口与位宽"><rect width="1680" height="1060" fill="white"/><text x="35" y="45.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#24384d">llaccel GEMM：把模块当作黑箱，输入输出分别有哪些位？</text><text x="35" y="83.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#61738a">左侧箭头流入模块，右侧箭头流出模块；每框先给总位数，再拆成具体信号。</text><rect x="655" y="150" width="350" height="745" rx="12" fill="#e8eff9" stroke="#9cb4d3" stroke-width="2"/><text x="830" y="206.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="38" font-weight="700" text-anchor="middle" fill="#24384d">GEMM</text><text x="830" y="252" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#24384d">声明输入 3080 bit</text><text x="830" y="291" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#24384d">声明输出 673 bit</text><text x="830" y="380" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#24384d">权重双缓冲</text><text x="830" y="431" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#24384d">16 × 16 个 INT8 乘法单元</text><text x="830" y="482" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#24384d">求和与 INT32 累加状态</text><text x="830" y="533" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#24384d">偏置 / 再量化流水</text><text x="830" y="584" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#24384d">输出 FIFO</text><rect x="680" y="700" width="300" height="135" rx="8" fill="#fffaf0" stroke="#dac59c" stroke-width="2"/><text x="830" y="735" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#8f6d37">当前写回有效数据最多 256 bit</text><text x="830" y="764" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#8f6d37">512 bit 是接口容器宽度</text><text x="830" y="793" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#8f6d37">字节掩码决定实际写哪些字节</text><rect x="30" y="145" width="560" height="117" rx="8" fill="#f5f8fb" stroke="#d2deea" stroke-width="2"/><text x="50" y="178.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#286584">权重数据与返回状态 · 2050 bit</text><text x="50" y="210" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52677d">数据 2048 + 允许访问 1 + 返回有效 1</text><text x="50" y="238" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52677d">gemm_w_rdata / grant / rvalid</text><path d="M590 203 L655 203" fill="none" stroke="#397b98" stroke-width="3"/><polygon points="655,203 642,198 642,208" fill="#397b98"/><rect x="30" y="300" width="560" height="117" rx="8" fill="#f5f8fb" stroke="#d2deea" stroke-width="2"/><text x="50" y="333.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#286584">A / 参数数据与返回状态 · 514 bit</text><text x="50" y="365" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52677d">数据 512 + 允许访问 1 + 返回有效 1</text><text x="50" y="393" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52677d">同一读口也用于再量化参数和偏置</text><path d="M590 358 L655 358" fill="none" stroke="#397b98" stroke-width="3"/><polygon points="655,358 642,353 642,363" fill="#397b98"/><rect x="30" y="455" width="560" height="117" rx="8" fill="#f5f8fb" stroke="#d2deea" stroke-width="2"/><text x="50" y="488.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#286584">任务输入 · 513 bit</text><text x="50" y="520" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52677d">指令 512 + 指令有效 1</text><text x="50" y="548" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52677d">instr / instr_valid</text><path d="M590 513 L655 513" fill="none" stroke="#397b98" stroke-width="3"/><polygon points="655,513 642,508 642,518" fill="#397b98"/><rect x="30" y="610" width="560" height="117" rx="8" fill="#f5f8fb" stroke="#d2deea" stroke-width="2"/><text x="50" y="643.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#286584">结果写入是否被接受 · 1 bit</text><text x="50" y="675" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52677d">写许可 grant：1 bit</text><text x="50" y="703" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52677d">gemm_wr_grant</text><path d="M590 668 L655 668" fill="none" stroke="#397b98" stroke-width="3"/><polygon points="655,668 642,663 642,673" fill="#397b98"/><rect x="30" y="765" width="560" height="117" rx="8" fill="#f5f8fb" stroke="#d2deea" stroke-width="2"/><text x="50" y="798.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#286584">基础控制 · 2 bit</text><text x="50" y="830" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52677d">时钟 clk 1 + 低有效复位 rst_n 1</text><text x="50" y="858" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52677d">不属于数据负载</text><path d="M590 823 L655 823" fill="none" stroke="#397b98" stroke-width="3"/><polygon points="655,823 642,818 642,828" fill="#397b98"/><rect x="1090" y="145" width="560" height="117" rx="8" fill="#f5f8fb" stroke="#d2deea" stroke-width="2"/><text x="1110" y="178.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#8a653e">权重读取请求 · 27 bit</text><text x="1110" y="210" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52677d">字节地址 24 + 尺寸编码 2 + 有效 1</text><text x="1110" y="238" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52677d">gemm_w_req / gemm_w_valid</text><path d="M1005 203 L1090 203" fill="none" stroke="#ad7e45" stroke-width="3"/><polygon points="1090,203 1077,198 1077,208" fill="#ad7e45"/><rect x="1090" y="300" width="560" height="117" rx="8" fill="#f5f8fb" stroke="#d2deea" stroke-width="2"/><text x="1110" y="333.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#8a653e">A / 参数读取请求 · 27 bit</text><text x="1110" y="365" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52677d">字节地址 24 + 尺寸编码 2 + 有效 1</text><text x="1110" y="393" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52677d">gemm_a_req / gemm_a_valid</text><path d="M1005 358 L1090 358" fill="none" stroke="#ad7e45" stroke-width="3"/><polygon points="1090,358 1077,353 1077,363" fill="#ad7e45"/><rect x="1090" y="455" width="560" height="117" rx="8" fill="#f5f8fb" stroke="#d2deea" stroke-width="2"/><text x="1110" y="488.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#8a653e">结果写回 · 603 bit</text><text x="1110" y="520" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52677d">数据 512 + 字节掩码 64</text><text x="1110" y="548" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52677d">地址 / 尺寸 26 + 请求有效 1</text><path d="M1005 513 L1090 513" fill="none" stroke="#ad7e45" stroke-width="3"/><polygon points="1090,513 1077,508 1077,518" fill="#ad7e45"/><rect x="1090" y="610" width="560" height="117" rx="8" fill="#f5f8fb" stroke="#d2deea" stroke-width="2"/><text x="1110" y="643.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#8a653e">任务状态 · 11 bit</text><text x="1110" y="675" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52677d">可接任务 1 + 忙 1 + 完成 1</text><text x="1110" y="703" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52677d">完成的同步信号编号 8</text><path d="M1005 668 L1090 668" fill="none" stroke="#ad7e45" stroke-width="3"/><polygon points="1090,668 1077,663 1077,673" fill="#ad7e45"/><rect x="1090" y="765" width="560" height="117" rx="8" fill="#f5f8fb" stroke="#d2deea" stroke-width="2"/><text x="1110" y="798.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#8a653e">性能统计脉冲 · 5 bit</text><text x="1110" y="830" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52677d">忙 1 + 乘加周期 1 + 后处理周期 1</text><text x="1110" y="858" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52677d">SRAM 等待状态 2</text><path d="M1005 823 L1090 823" fill="none" stroke="#ad7e45" stroke-width="3"/><polygon points="1090,823 1077,818 1077,828" fill="#ad7e45"/><text x="35" y="955.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#607187">位宽不等于物理独立线数，也不等于每周期有效吞吐；常量、别名与优化会改变保留布线。</text><text x="35" y="995.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#24677d">寄存器 → bank 写通路：M4+ 75.86%（所选数据状态与 bank 边界间的整网统计）</text><text x="35" y="1030.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#607187">原始端口线名未全部保留；逐层图采用具名寄存器与 bank 引脚端点，不冒充逐端口完整恢复。</text></svg>