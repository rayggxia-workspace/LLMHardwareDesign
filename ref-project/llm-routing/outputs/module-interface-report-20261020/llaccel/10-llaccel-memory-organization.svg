<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="1020" viewBox="0 0 1540 1020" role="img" aria-label="llaccel SRAM crossbar 与 16 个 bank 的逻辑组织"><rect width="1540" height="1020" fill="white"/><text x="35" y="45.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#24384d">llaccel 的共享存储接口：10 个请求口如何连接 16 个 bank</text><text x="35" y="82.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#5b7086">crossbar 负责选路与冲突仲裁；它本身不是保存矩阵数据的存储阵列。</text><rect x="35" y="120" width="1470" height="160" rx="12" fill="#edf4fa" stroke="#bbcede" stroke-width="2"/><text x="65" y="160.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#24384d">请求端：GEMM 3 口 + ATTENTION 2 口 + VECTOR 3 口 + DMA 2 口 = 10 口</text><text x="65" y="205.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#24384d">每个请求：24 bit 字节地址 + 2 bit 尺寸编码；另有有效 / 允许访问等控制</text><text x="65" y="236.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#24384d">读取权重可请求 256 B；其他读取接口容器为 64 B，写入容器为 64 B，实际尺寸可更小</text><path d="M770 280 L770 330" fill="none" stroke="#3e8795" stroke-width="3"/><polygon points="770,330 775,317 765,317" fill="#3e8795"/><rect x="35" y="330" width="1470" height="220" rx="12" fill="#eaf4ed" stroke="#a9c4b0" stroke-width="2"/><text x="65" y="372.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#24384d">SRAM crossbar：按请求地址和尺寸选 bank；同一周期拒绝有 bank 冲突的低优先级请求</text><text x="65" y="413.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#24384d">请求地址的含义（24 bit）</text><rect x="65" y="435" width="730" height="85" rx="4" fill="#dce8f3" stroke="#bac9d6" stroke-width="2"/><text x="430.0" y="467.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#24384d">[23:8] · 16 bit</text><text x="430.0" y="499.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#24384d">发给 bank 的行地址</text><rect x="795" y="435" width="345" height="85" rx="4" fill="#e5def2" stroke="#bac9d6" stroke-width="2"/><text x="967.5" y="467.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#24384d">[7:4] · 4 bit</text><text x="967.5" y="499.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#24384d">起始 bank 编号</text><rect x="1140" y="435" width="260" height="85" rx="4" fill="#f4e9d8" stroke="#bac9d6" stroke-width="2"/><text x="1270.0" y="467.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#24384d">[3:0] · 4 bit</text><text x="1270.0" y="499.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#24384d">16 B 对齐时为 0</text><path d="M770 550 L770 600" fill="none" stroke="#9b783e" stroke-width="3"/><polygon points="770,600 775,587 765,587" fill="#9b783e"/><polygon points="770,550 765,563 775,563" fill="#9b783e"/><rect x="35" y="600" width="1470" height="330" rx="12" fill="#fffaf0" stroke="#bdaa87" stroke-width="2" stroke-dasharray="8 6"/><text x="65" y="643.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#24384d">核心边界之外：16 个 SRAM bank（仅画逻辑组织，不表示实际宏布局）</text><rect x="65" y="680" width="155" height="77" rx="6" fill="#f5e5c8" stroke="#c9aa70" stroke-width="2"/><text x="142" y="710.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#24384d">Bank 0</text><text x="142" y="739.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#24384d">数据宽 128 bit</text><rect x="239" y="680" width="155" height="77" rx="6" fill="#f5e5c8" stroke="#c9aa70" stroke-width="2"/><text x="316" y="710.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#24384d">Bank 1</text><text x="316" y="739.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#24384d">数据宽 128 bit</text><rect x="413" y="680" width="155" height="77" rx="6" fill="#f5e5c8" stroke="#c9aa70" stroke-width="2"/><text x="490" y="710.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#24384d">Bank 2</text><text x="490" y="739.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#24384d">数据宽 128 bit</text><rect x="587" y="680" width="155" height="77" rx="6" fill="#f5e5c8" stroke="#c9aa70" stroke-width="2"/><text x="664" y="710.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#24384d">Bank 3</text><text x="664" y="739.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#24384d">数据宽 128 bit</text><rect x="761" y="680" width="155" height="77" rx="6" fill="#f5e5c8" stroke="#c9aa70" stroke-width="2"/><text x="838" y="710.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#24384d">Bank 4</text><text x="838" y="739.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#24384d">数据宽 128 bit</text><rect x="935" y="680" width="155" height="77" rx="6" fill="#f5e5c8" stroke="#c9aa70" stroke-width="2"/><text x="1012" y="710.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#24384d">Bank 5</text><text x="1012" y="739.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#24384d">数据宽 128 bit</text><rect x="1109" y="680" width="155" height="77" rx="6" fill="#f5e5c8" stroke="#c9aa70" stroke-width="2"/><text x="1186" y="710.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#24384d">Bank 6</text><text x="1186" y="739.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#24384d">数据宽 128 bit</text><rect x="1283" y="680" width="155" height="77" rx="6" fill="#f5e5c8" stroke="#c9aa70" stroke-width="2"/><text x="1360" y="710.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#24384d">Bank 7</text><text x="1360" y="739.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#24384d">数据宽 128 bit</text><rect x="65" y="780" width="155" height="77" rx="6" fill="#f5e5c8" stroke="#c9aa70" stroke-width="2"/><text x="142" y="810.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#24384d">Bank 8</text><text x="142" y="839.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#24384d">数据宽 128 bit</text><rect x="239" y="780" width="155" height="77" rx="6" fill="#f5e5c8" stroke="#c9aa70" stroke-width="2"/><text x="316" y="810.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#24384d">Bank 9</text><text x="316" y="839.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#24384d">数据宽 128 bit</text><rect x="413" y="780" width="155" height="77" rx="6" fill="#f5e5c8" stroke="#c9aa70" stroke-width="2"/><text x="490" y="810.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#24384d">Bank 10</text><text x="490" y="839.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#24384d">数据宽 128 bit</text><rect x="587" y="780" width="155" height="77" rx="6" fill="#f5e5c8" stroke="#c9aa70" stroke-width="2"/><text x="664" y="810.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#24384d">Bank 11</text><text x="664" y="839.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#24384d">数据宽 128 bit</text><rect x="761" y="780" width="155" height="77" rx="6" fill="#f5e5c8" stroke="#c9aa70" stroke-width="2"/><text x="838" y="810.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#24384d">Bank 12</text><text x="838" y="839.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#24384d">数据宽 128 bit</text><rect x="935" y="780" width="155" height="77" rx="6" fill="#f5e5c8" stroke="#c9aa70" stroke-width="2"/><text x="1012" y="810.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#24384d">Bank 13</text><text x="1012" y="839.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#24384d">数据宽 128 bit</text><rect x="1109" y="780" width="155" height="77" rx="6" fill="#f5e5c8" stroke="#c9aa70" stroke-width="2"/><text x="1186" y="810.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#24384d">Bank 14</text><text x="1186" y="839.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#24384d">数据宽 128 bit</text><rect x="1283" y="780" width="155" height="77" rx="6" fill="#f5e5c8" stroke="#c9aa70" stroke-width="2"/><text x="1360" y="810.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#24384d">Bank 15</text><text x="1360" y="839.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#24384d">数据宽 128 bit</text><text x="65" y="904.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#896c3b">每个 bank：读数据 128 + 写数据 128 + 地址 16 + 字节写掩码 16 + 使能 1（bit）</text><text x="35" y="970.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#536a81">GEMM 的 256 B 权重请求占用全部 16 个 bank；其他请求只有在访问的 bank 不冲突时才能并行。</text><text x="35" y="1003.0" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#536a81">读出合计 2048 bit、写入合计 2048 bit 是同一组 bank 的接口宽度，不是每个引擎各有一套独占存储端口。</text></svg>